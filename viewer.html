<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀表板預覽</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-grid-layout/1.4.3/react-grid-layout.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/react-grid-layout/1.4.3/css/styles.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/react-resizable/3.0.5/css/styles.min.css" />

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcvwNe51K8T3f-58oiNIU-WQbQZuYjOAo",
            authDomain: "makeowndashboard.firebaseapp.com",
            projectId: "makeowndashboard",
            storageBucket: "makeowndashboard.firebasestorage.app",
            messagingSenderId: "791722954695",
            appId: "1:791722954695:web:ce22cc59fad57d22d053e2",
            measurementId: "G-20DS6V8JDB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 讀取雲端專案進度
        window.loadFromFirebase = async (id) => {
            try {
                const docRef = doc(db, "dashboards", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) return docSnap.data();
                else return null;
            } catch (e) {
                console.error("❌ 讀取失敗: ", e); throw e;
            }
        };
    </script>

    <style>
        :root {
            --primary: #086788;
            --secondary: #F8F8F8;
            --border: #e0e0e0;
            --accent: #F0C808;
        }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background: transparent; /* Viewer 通常嵌入在 iframe 內，背景設為透明 */
            margin: 0;
            padding: 10px; /* 嵌入時的微調留白 */
            color: #333;
        }

        .preview-container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            min-height: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .news-title {
            margin: 0;
            color: #222;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .news-footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.85rem;
            color: #888;
        }

        .news-footer-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .news-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .news-footer a:hover {
            text-decoration: underline;
        }

        .news-watermark {
            object-fit: contain;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: 30px;
            gap: 15px;
        }

        .preview-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .preview-card-title {
            margin-top: 0;
            font-size: 1.1rem;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .reset-filter-btn {
            background: #eee;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: auto;
            display: block;
            margin-bottom: 15px;
            color: #555;
            transition: 0.2s;
        }
        .reset-filter-btn:hover {
            background: #e0e0e0;
        }

        .waiting-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 150px;
            color: #999;
            font-weight: bold;
            background: #f9f9f9;
            border-radius: 8px;
            border: 2px dashed #ddd;
            text-align: center;
            padding: 20px;
        }

        /* 🌟 RWD 排版魔法完全繼承 */
        .chart-scroll-area {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        /* 當螢幕寬度小於 768px (手機版) 時，自動觸發響應式設計 */
        @media (max-width: 768px) {
            .preview-container {
                padding: 15px;
            }
            .news-header {
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }
            .news-title {
                font-size: 1.4rem !important;
                word-break: break-word;
                line-height: 1.3;
            }
            .news-watermark {
                margin-left: auto !important;
                max-width: 80px;
            }
            .news-footer {
                flex-direction: row;
                align-items: flex-end;
                gap: 10px;
            }
            .preview-grid {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            .preview-card {
                width: 100% !important;
                max-width: 100%;
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
                height: auto !important;
                min-height: 150px;
            }
            .reset-filter-btn {
                width: 100%;
                text-align: center;
            }
            /* 🌟 手機版橫向長條圖解除捲軸，向下撐開 */
            .chart-scroll-area.is-horizontal {
                overflow-y: visible !important;
                height: auto !important;
            }
            .chart-scroll-area.is-line-chart, .chart-scroll-area.is-bar-chart.is-vertical {
                aspect-ratio: 1 / 1;
                min-height: 300px;
            }
        }

        /* 其他積木 CSS */
        .timeline-container { margin: 10px 0; display: flex; flex-direction: column; overflow-y: auto; height: 100%; width: 100%; padding: 5px 10px; }
        .timeline-item { display: flex; position: relative; }
        .timeline-left { width: var(--time-width, 20%); flex-shrink: 0; text-align: right; padding-right: var(--timeline-gap, 15px); font-weight: bold; color: var(--time-color, var(--primary)); font-size: 0.95rem; padding-top: 2px; }
        .timeline-right { flex: 1; padding-left: var(--timeline-gap, 20px); padding-bottom: 25px; border-left: 2px solid var(--line-color, var(--primary)); position: relative; }
        .timeline-item:last-child .timeline-right { border-left-color: transparent !important; }
        .timeline-dot { position: absolute; left: -8px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--node-color, var(--primary)); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--node-color, var(--primary)); box-sizing: border-box; z-index: 2; }
        .timeline-title { font-weight: 900; font-size: 1.1rem; margin: 0 0 5px 0; color: #333; line-height: 1.4; }
        .timeline-desc { margin: 0; color: #666; font-size: 0.95rem; line-height: 1.6; }
        
        .custom-btn-wrapper { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .custom-btn { display: inline-block; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; text-align: center; color: #fff; transition: 0.2s; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 80%; }
        .custom-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); filter: brightness(1.1); }
        
        .timeline-link-btn { display: inline-block; margin-top: 10px; padding: 5px 12px; font-size: 0.85rem; color: var(--time-color, var(--primary)); background: #fff; border: 1px solid var(--time-color, var(--primary)); border-radius: 4px; text-decoration: none !important; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .timeline-link-btn:hover { color: #fff; background: var(--time-color, var(--primary)); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        
        .carousel-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .carousel-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 30px; box-sizing: border-box; animation: fadeIn 0.4s ease-in-out; overflow-y: auto; }
        .carousel-img { max-width: 100%; max-height: 160px; object-fit: contain; margin-bottom: 15px; border-radius: 8px; }
        .carousel-nav { display: flex; justify-content: space-between; position: absolute; top: 50%; width: 100%; transform: translateY(-50%); pointer-events: none; }
        .carousel-arrow { pointer-events: auto; background: rgba(0, 0, 0, 0.15); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 5px; font-weight: bold; transition: 0.2s; }
        .carousel-arrow:hover { background: var(--primary); }
        .carousel-dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 5px 0; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; cursor: pointer; transition: 0.2s; }
        .carousel-dot.active { background: var(--primary); transform: scale(1.2); }

        /* 🌟 數據表格專屬樣式 */
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; }
        .custom-table th { position: sticky; top: 0; color: #fff; padding: 12px 15px; font-weight: bold; z-index: 2; white-space: nowrap; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .custom-table td { padding: 10px 15px; border-bottom: 1px solid #eee; color: #444; white-space: nowrap; }
        .custom-table tbody tr:nth-child(even) { background-color: #fafafa; }
        .custom-table tbody tr:hover { background-color: #f0f8fa; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function PreviewViewer({ config }) {
            const [dataMap, setDataMap] = useState({});
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [filters, setFilters] = useState({});

            useEffect(() => {
                const fetchData = async () => {
                    if (!config.sheetSources || config.sheetSources.length === 0) {
                        setError("尚未設定任何資料庫。");
                        setLoading(false); return;
                    }
                    try {
                        const newDataMap = {};
                        await Promise.all(config.sheetSources.map(async (source) => {
                            if (!source.sheetId) return;
                            const url = `https://docs.google.com/spreadsheets/d/${source.sheetId}/gviz/tq?tqx=out:json&headers=1&tq&gid=${source.gid || '0'}`;
                            const res = await fetch(url);
                            const text = await res.text();
                            const json = JSON.parse(text.substring(47, text.length - 2));

                            let cols = json.table.cols.map(c => c.label).filter(l => l && l.trim() !== '');
                            let rowsData = json.table.rows;

                            if (cols.length === 0 && rowsData.length > 0) {
                                cols = rowsData[0].c.map(cell => cell ? (cell.f || cell.v || '') : '').filter(l => String(l).trim() !== '');
                                rowsData = rowsData.slice(1);
                            }

                            const parsedData = rowsData.map(row => {
                                let obj = {};
                                row.c.forEach((cell, i) => {
                                    if (cols[i]) {
                                        obj[cols[i]] = cell ? (cell.f ? String(cell.f) : (cell.v !== null ? String(cell.v) : '')) : '';
                                    }
                                });
                                return obj;
                            });
                            newDataMap[source.id] = parsedData;
                        }));
                        setDataMap(newDataMap);
                    } catch (err) {
                        setError("資料庫連線失敗，請檢查權限。");
                    }
                    setLoading(false);
                };
                fetchData();
            }, [config.sheetSources]);

            const sortedComponents = [...config.components].sort((a, b) => {
                if (a.layout.y === b.layout.y) return a.layout.x - b.layout.x;
                return a.layout.y - b.layout.y;
            });

            // 🧠 魔法 1：每個積木自己決定要撈什麼資料
            const getFilteredDataForComp = (comp) => {
                const sourceData = dataMap[comp.dataSourceId] || [];
                return sourceData.filter(row => {
                    for (let key in filters) {
                        if (!filters[key]) continue;
                        if (comp.type === 'dropdown' && key === comp.categoryColumn) continue;
                        const listens = comp.listenAll !== false || (comp.customListenCols && comp.customListenCols.includes(key));
                        if (listens && row[key] !== undefined && String(row[key]) !== String(filters[key])) {
                            return false;
                        }
                    }
                    return true;
                });
            };

            // 🧠 魔法 2：下拉選單改變時的精準連動
            const handleFilterChange = (column, value) => {
                setFilters(prev => {
                    const newFilters = { ...prev, [column]: value };
                    sortedComponents.forEach((dComp) => {
                        if (dComp.type === 'dropdown' && dComp.categoryColumn && dComp.categoryColumn !== column) {
                            const listensToThisCol = dComp.listenAll !== false || (dComp.customListenCols && dComp.customListenCols.includes(column));
                            if (listensToThisCol) {
                                if (prev[column] !== value) newFilters[dComp.categoryColumn] = '';
                            }
                        }
                    });
                    return newFilters;
                });
            };

            const clearFilters = () => setFilters({});

            // 🧠 魔法 3：檢查積木是否該進入「等待選擇」狀態
            const getMissingDropdowns = (comp) => {
                if (comp.type === 'dropdown') return [];
                const upstreamDropdowns = sortedComponents.filter(c =>
                    c.type === 'dropdown' && c.categoryColumn && (comp.listenAll !== false || (comp.customListenCols && comp.customListenCols.includes(c.categoryColumn)))
                );
                return upstreamDropdowns.filter(uComp => !filters[uComp.categoryColumn]).map(c => c.categoryColumn);
            };

            const checkDropdownDisabled = (comp) => {
                if (comp.type !== 'dropdown') return false;
                const myListenCols = comp.listenAll !== false
                    ? sortedComponents.filter(c => c.type === 'dropdown' && c.categoryColumn && c.id !== comp.id).map(c => c.categoryColumn)
                    : (comp.customListenCols || []);
                return myListenCols.some(colName => colName && !filters[colName]);
            };

            const aggregateData = (rawData, categoryCol, valueCol, aggType) => {
                if (!valueCol) return {};
                let result = {};
                rawData.forEach(row => {
                    let catRaw = categoryCol ? (row[categoryCol] || '未分類') : '總計';
                    if (aggType === 'first') {
                        if (result[catRaw] === undefined) result[catRaw] = row[valueCol] || '';
                        return;
                    }
                    if (typeof catRaw === 'string' && catRaw.includes('|') && catRaw.includes(':')) {
                        let parts = catRaw.split('|');
                        parts.forEach(part => {
                            let [subCat, subValStr] = part.split(':');
                            if (subCat && subValStr !== undefined) {
                                let val = parseFloat(String(subValStr).replace(/,/g, '')) || 0;
                                if (val > 0) {
                                    if (aggType === 'sum') result[subCat] = (result[subCat] || 0) + val;
                                    else if (aggType === 'count') result[subCat] = (result[subCat] || 0) + 1;
                                }
                            }
                        });
                    } else {
                        let val = parseFloat(String(row[valueCol]).replace(/,/g, '')) || 0;
                        if (val > 0 || aggType === 'count') {
                            if (aggType === 'sum') result[catRaw] = (result[catRaw] || 0) + val;
                            else if (aggType === 'count') result[catRaw] = (result[catRaw] || 0) + 1;
                        }
                    }
                });
                return result;
            };

            const aggregateStackedData = (rawData, categoryCol, valueCols, aggType) => {
                const categories = [...new Set(rawData.map(r => r[categoryCol]))].filter(Boolean);
                let datasetsMap = {};
                categories.forEach((cat, catIndex) => {
                    const rows = rawData.filter(r => r[categoryCol] === cat);
                    rows.forEach(r => {
                        valueCols.forEach(col => {
                            if (!col) return;
                            let valRaw = r[col];
                            if (typeof valRaw === 'string' && valRaw.includes('|') && valRaw.includes(':')) {
                                let parts = valRaw.split('|');
                                parts.forEach(part => {
                                    let [subCat, subValStr] = part.split(':');
                                    if (subCat && subValStr !== undefined) {
                                        let val = parseFloat(String(subValStr).replace(/,/g, '')) || 0;
                                        if (!datasetsMap[subCat]) datasetsMap[subCat] = new Array(categories.length).fill(0);
                                        if (aggType === 'sum') datasetsMap[subCat][catIndex] += val;
                                        else if (aggType === 'count' && val > 0) datasetsMap[subCat][catIndex] += 1;
                                    }
                                });
                            } else {
                                let val = parseFloat(String(valRaw).replace(/,/g, '')) || 0;
                                if (!datasetsMap[col]) datasetsMap[col] = new Array(categories.length).fill(0);
                                if (aggType === 'sum') datasetsMap[col][catIndex] += val;
                                else if (aggType === 'count' && val > 0) datasetsMap[col][catIndex] += 1;
                            }
                        });
                    });
                });
                const datasets = Object.keys(datasetsMap).map(label => ({ label: label, data: datasetsMap[label] }));
                return { categories, datasets };
            };

            if (loading) return <div className="preview-container"><h3 style={{ textAlign: 'center', color: '#086788' }}>資料載入中，請稍候...</h3></div>;
            if (error) return <div className="preview-container"><h3 style={{ color: '#E74C3C', textAlign: 'center' }}>{error}</h3></div>;

            return (
                <div className="preview-container">
                    <div className="news-header">
                        <div style={{ flex: 1, textAlign: config.meta.titleAlign || 'left' }}>
                            <h2 className="news-title" style={{
                                color: config.meta.titleColor || '#222',
                                fontSize: config.meta.titleFontSize || '1.8rem',
                                fontWeight: config.meta.titleFontWeight || '900',
                                fontFamily: config.meta.titleFontFamily || 'inherit',
                                margin: 0
                            }}>
                                {config.meta.title}
                            </h2>
                        </div>
                        {config.meta.watermarkUrl && config.meta.watermarkPosition === 'top-right' && (
                            <img src={config.meta.watermarkUrl} alt="Watermark" className="news-watermark" style={{ height: `${config.meta.watermarkSize || 40}px`, marginLeft: '15px' }} />
                        )}
                    </div>

                    {Object.values(filters).some(v => v) && (
                        <button className="reset-filter-btn" onClick={clearFilters}>↺ 清除所有篩選與重新開始</button>
                    )}

                    <div className="preview-grid">
                        {sortedComponents.map(comp => (
                            <ChartComponent
                                key={comp.id} comp={comp}
                                rawData={dataMap[comp.dataSourceId] || []}
                                filteredData={getFilteredDataForComp(comp)}
                                aggregateData={aggregateData} filters={filters} onFilterChange={handleFilterChange}
                                missingDropdowns={getMissingDropdowns(comp)}
                                isDropdownDisabled={checkDropdownDisabled(comp)}
                                aggregateStackedData={aggregateStackedData}
                            />
                        ))}
                    </div>

                    <div className="news-footer">
                        <div className="news-footer-left">
                            {config.meta.lastUpdated && <div>🕒 更新時間：{config.meta.lastUpdated}</div>}
                            {config.meta.dataSources && config.meta.dataSources.length > 0 && (
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px', alignItems: 'center' }}>
                                    <span>資料來源：</span>
                                    {config.meta.dataSources.map((source, idx) => (
                                        <span key={idx}>
                                            {source.url ? (
                                                <a href={source.url} target="_blank" rel="noreferrer">{source.name || '未命名來源'}</a>
                                            ) : (
                                                <span>{source.name || '未命名來源'}</span>
                                            )}
                                            {idx < config.meta.dataSources.length - 1 && '、'}
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>
                        {config.meta.watermarkUrl && config.meta.watermarkPosition === 'bottom-right' && (
                            <img src={config.meta.watermarkUrl} alt="Watermark" className="news-watermark" style={{ height: `${config.meta.watermarkSize || 40}px` }} />
                        )}
                    </div>
                </div>
            );
        }

        // 🌟 核心畫布元件
        function ChartComponent({ comp, rawData, filteredData, aggregateData, filters, onFilterChange, missingDropdowns, isDropdownDisabled, aggregateStackedData }) {
            const isChartVisible = !missingDropdowns || missingDropdowns.length === 0;
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);
            const isChartType = ['barChart', 'pieChart', 'lineChart', 'stackedBarChart'].includes(comp.type);

            const [labelCount, setLabelCount] = useState(0);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [hiddenSlices, setHiddenSlices] = useState({});

            useEffect(() => {
                setCurrentSlide(0);
                setHiddenSlices({});
            }, [filteredData, comp.categoryColumn]);

            const toggleSlice = (index) => {
                if (!chartInstance.current || comp.type !== 'pieChart') return;
                chartInstance.current.toggleDataVisibility(index);
                chartInstance.current.update();
                setHiddenSlices(prev => ({ ...prev, [index]: !prev[index] }));
            };

            useEffect(() => {
                if (isChartType && isChartVisible) {
                    if (comp.type === 'barChart' || comp.type === 'stackedBarChart' || comp.type === 'lineChart') {
                        const hasData = (comp.multiValueCols && comp.multiValueCols.length > 0) || comp.valueColumn;
                        if (!comp.categoryColumn || !hasData) return;
                    } else {
                        if (!comp.categoryColumn || !comp.valueColumn) return;
                    }

                    if (!canvasRef.current) return;

                    const ctx = canvasRef.current.getContext('2d');
                    if (chartInstance.current) chartInstance.current.destroy();

                    let chartType = 'bar';
                    const isHorizontal = comp.chartOrientation === 'horizontal';

                    const computedFont = window.getComputedStyle(canvasRef.current).fontFamily;
                    const defaultFontFamily = comp.fontFamily || computedFont || 'sans-serif';

                    const baseFontSize = parseInt(comp.axisLabelSize) || 12;
                    const tickFont = { size: baseFontSize, family: defaultFontFamily };
                    const gridColor = comp.axisGridColor || '#e0e0e0';

                    let options = {
                        responsive: true, maintainAspectRatio: false,

                                                    return (
                                                        <th key={idx} style={{
                                                            background: comp.tableHeaderBg || comp.themeColor || '#086788',
                                                            color: comp.tableHeaderColor || '#ffffff', fontSize: `${comp.tableHeaderSize || 14}px`,
                                                            textAlign: comp.tableHeaderAlign || 'left', fontWeight: comp.tableHeaderWeight || 'bold',
                                                            border: borderStyle, left: isTopLeft ? 0 : undefined, zIndex: isTopLeft ? 3 : 1
                                                        }}>{col}</th>
                                                    );
                                                })}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayData.map((row, rIdx) => (
                                                <tr key={rIdx}>
                                                    {comp.multiValueCols.filter(Boolean).map((col, cIdx) => {
                                                        const isFirstCol = cIdx === 0 && comp.tableColEnable;
                                                        const cellStyle = isFirstCol ? {
                                                            fontSize: `${comp.tableColSize || 14}px`, color: comp.tableColColor || '#444444',
                                                            fontWeight: comp.tableColWeight || 'bold', textAlign: comp.tableColAlign || 'left',
                                                            backgroundColor: (comp.tableColBg && comp.tableColBg !== 'transparent') ? comp.tableColBg : '#ffffff',
                                                            border: borderStyle, position: 'sticky', left: 0, zIndex: 1
                                                        } : {
                                                            fontSize: `${comp.tableBodySize || 14}px`, color: comp.tableBodyColor || '#444444',
                                                            fontWeight: comp.tableBodyWeight || 'normal', textAlign: comp.tableBodyAlign || 'left',
                                                            border: borderStyle
                                                        };
                                                        return <td key={cIdx} style={cellStyle}>{row[col] !== undefined && row[col] !== null ? String(row[col]) : ''}</td>;
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                );
                            })()}
                        </div>
                    )}

                    {comp.type === 'carousel' && (
                        <div className="carousel-container" style={{ '--primary': comp.themeColor || '#086788' }}>
                            {(!comp.categoryColumn && !comp.valueColumn && !comp.imageColumn) ? (
                                <p style={{ color: '#999', textAlign: 'center', marginTop: '20px' }}>請在右側資料面板綁定欄位</p>
                            ) : (
                                <>
                                    <div className="carousel-slide">
                                        {filteredData[currentSlide] && (
                                            <>
                                                {comp.imageColumn && filteredData[currentSlide][comp.imageColumn] && <img src={filteredData[currentSlide][comp.imageColumn]} className="carousel-img" alt="slide" />}
                                                {comp.categoryColumn && filteredData[currentSlide][comp.categoryColumn] && <h3 style={{ color: comp.titleColor || '#333', fontSize: comp.titleSize || '1.3rem', margin: '0 0 10px 0' }}>{filteredData[currentSlide][comp.categoryColumn]}</h3>}
                                                {comp.valueColumn && filteredData[currentSlide][comp.valueColumn] && <p style={{ color: comp.descColor || '#666', fontSize: comp.descSize || '1rem', whiteSpace: 'pre-wrap', wordBreak: 'break-word', margin: 0, lineHeight: '1.6' }}>{filteredData[currentSlide][comp.valueColumn]}</p>}
                                            </>
                                        )}
                                    </div>
                                    {filteredData.length > 1 && (
                                        <>
                                            <div className="carousel-nav">
                                                <button className="carousel-arrow" onClick={(e) => { e.stopPropagation(); setCurrentSlide(prev => prev > 0 ? prev - 1 : filteredData.length - 1); }}>&lt;</button>
                                                <button className="carousel-arrow" onClick={(e) => { e.stopPropagation(); setCurrentSlide(prev => prev < filteredData.length - 1 ? prev + 1 : 0); }}>&gt;</button>
                                            </div>
                                            <div className="carousel-dots">
                                                {filteredData.map((_, i) => <div key={i} className={`carousel-dot ${i === currentSlide ? 'active' : ''}`} onClick={(e) => { e.stopPropagation(); setCurrentSlide(i); }}></div>)}
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // 🌟 核心預覽載入與介面渲染
        function ViewerApp() {
            const params = new URLSearchParams(window.location.search);
            const urlId = params.get('id');
            const [config, setConfig] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                const loadData = async () => {
                    if (!urlId) {
                        setError("缺少儀表板 ID。請確定您的網址正確。");
                        return;
                    }
                    try {
                        const data = await window.loadFromFirebase(urlId);
                        if (data) {
                            setConfig(data);
                        } else {
                            setError("找不到此專案或連結已失效。");
                        }
                    } catch (e) {
                        setError("讀取失敗，請稍後再試。");
                    }
                };
                loadData();
            }, [urlId]);

            if (error) return <h2 style={{ textAlign: 'center', marginTop: '50px', color: '#E74C3C', fontFamily: 'sans-serif' }}>{error}</h2>;
            if (!config) return <h2 style={{ textAlign: 'center', marginTop: '50px', color: '#086788', fontFamily: 'sans-serif' }}>儀表板載入中...</h2>;

            return (
                <div className="preview-wrapper desktop" style={{ width: '100%', maxWidth: 'none', margin: 0, padding: 0 }}>
                    <PreviewViewer config={config} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewerApp />);
    </script>
</body>

</html>
