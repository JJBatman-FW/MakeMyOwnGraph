                                                                        <option value="round">圓角矩形 (預設)</option>
                                                                        <option value="pill">膠囊形 (全圓角)</option>
                                                                    </select>
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>背景顏色</label>
                                                                    <input type="color" value={currentSelectedBlock.themeColor || '#086788'} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'themeColor', e.target.value)} />
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>框線粗細 (px)</label>
                                                                    <input type="number" min="0" max="10" value={currentSelectedBlock.buttonBorderWidth !== undefined ? currentSelectedBlock.buttonBorderWidth : 0} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'buttonBorderWidth', parseInt(e.target.value) || 0)} />
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>框線顏色</label>
                                                                    <input type="color" value={currentSelectedBlock.buttonBorderColor || '#000000'} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'buttonBorderColor', e.target.value)} />
                                                                </div>
                                                            </div>

                                                            <hr style={{ border: 'none', borderTop: '2px dashed #ddd', margin: '15px 0' }} />

                                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>文字顏色</label>
                                                                    <input type="color" value={currentSelectedBlock.buttonTextColor || '#ffffff'} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'buttonTextColor', e.target.value)} />
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>文字大小</label>
                                                                    <select value={currentSelectedBlock.fontSize || '1.1rem'} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'fontSize', e.target.value)}>
                                                                        <option value="0.9rem">小 (0.9rem)</option>
                                                                        <option value="1.1rem">預設 (1.1rem)</option>
                                                                        <option value="1.3rem">大 (1.3rem)</option>
                                                                        <option value="1.5rem">特大 (1.5rem)</option>
                                                                    </select>
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>文字粗細</label>
                                                                    <select value={currentSelectedBlock.fontWeight || 'bold'} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'fontWeight', e.target.value)}>
                                                                        <option value="normal">正常</option>
                                                                        <option value="bold">粗體 (預設)</option>
                                                                        <option value="900">特粗</option>
                                                                    </select>
                                                                </div>
                                                                <div className="form-group" style={{ marginBottom: 0 }}>
                                                                    <label>字型</label>
                                                                    <select value={currentSelectedBlock.fontFamily || ''} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'fontFamily', e.target.value)}>
                                                                        <option value="">預設</option>
                                                                        <option value="Arial, sans-serif">黑體 (Arial)</option>
                                                                        <option value="'Times New Roman', serif">明體 (Times)</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* 🌟 表格專屬樣式設定 */}
                                                    {currentSelectedBlock.type === 'table' && (
                                                        <div style={{ background: '#f8f9fa', padding: '15px', borderRadius: '8px', marginBottom: '20px', border: '1px solid #e9ecef' }}>
                                                            {/* 🌟 需求 1, 2, 6：圖片轉換與自訂寬度 */}
                                                            <h4 style={{ marginTop: 0, marginBottom: '10px', color: '#086788' }}>🎛️ 進階表格設定</h4>
                                                            <div style={{ background: '#f8f9fa', padding: '15px', borderRadius: '8px', marginBottom: '20px', border: '1px solid #e9ecef' }}>
                                                                <div className="form-group" style={{ marginBottom: '10px' }}>
                                                                    <label>🖼️ 圖片欄位名稱 (多個請用逗號分隔)</label>
                                                                    <input type="text" value={currentSelectedBlock.tableImageCols || ''} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'tableImageCols', e.target.value)} placeholder="例如：候選人照片, 黨徽" />

                                                                <div className="form-group" style={{ marginBottom: 0 }}>

                                                                    <input type="text" value={currentSelectedBlock.tableColWidths || ''} onChange={(e) => updateBlockProperty(currentSelectedBlock.i, 'tableColWidths', e.target.value)} placeholder="例如：80px, 120px, auto, 15%" />

                                                                </div>
                                                                {/* 🌟 需求 5：表格分頁設定 */}

                                transition: 'width 0.3s ease'
                            }}>

                                {/* 📰 完美移植 1：發布版的頁首 (標題 + 藍色底線 + 頂部浮水印) */}
                                <div className="news-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', borderBottom: '3px solid #086788', paddingBottom: '15px', marginBottom: '25px' }}>
                                    <div style={{ flex: 1, textAlign: globalMeta.titleAlign || 'left' }}>
                                        <h2 className="news-title" style={{ color: globalMeta.titleColor || '#222', fontSize: globalMeta.titleFontSize || '1.8rem', fontWeight: globalMeta.titleFontWeight || '900', fontFamily: globalMeta.titleFontFamily || 'inherit', margin: 0 }}>
                                            {globalMeta.title}
                                        </h2>
                                    </div>
                                    {globalMeta.watermarkUrl && globalMeta.watermarkPosition === 'top-right' && (
                                        <img src={globalMeta.watermarkUrl} alt="Watermark" className="news-watermark" style={{ height: `${globalMeta.watermarkSize || 40}px`, marginLeft: '15px', objectFit: 'contain' }} />
                                    )}
                                </div>

                                {/* 🧹 重整資料按鈕與過濾器 */}
                                <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end', marginBottom: '15px', flexWrap: 'wrap' }}>
                                    <button className="reset-filter-btn" style={{ margin: 0, display: 'flex', alignItems: 'center', gap: '5px', background: isFetching ? '#e0e0e0' : '#e8f4f8', color: '#086788', borderColor: '#bce0ed', fontWeight: 'bold', padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', border: '1px solid' }} onClick={() => fetchSheetColumns(true)} disabled={isFetching}>
                                        {isFetching ? '⏳ 資料讀取中...' : '🔄 重新讀取最新資料'}
                                    </button>
                                    {Object.values(filters).some(v => v) && (
                                        <button className="reset-filter-btn" style={{ margin: 0, padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', border: '1px solid #ccc', background: '#eee', color: '#555' }} onClick={() => setFilters({})}>↺ 清除所有篩選與重新開始</button>
                                    )}
                                </div>

                                {/* 📊 圖表積木網格 */}
                                <ResponsiveRGL
                                    breakpoint={previewDevice}
                                    breakpoints={{ desktop: 768, mobile: 0 }}
                                    cols={{ desktop: 12, mobile: 12 }}
                                    layouts={{
                                        desktop: blocks.map(b => ({ i: String(b.i), x: b.x, y: b.y, w: b.w, h: b.h })),
                                        mobile: blocks.map(b => ({
                                            i: String(b.i),
                                            x: Number(b.mobile_x ?? b.x) || 0,
                                            y: Number(b.mobile_y ?? b.y) || 0,
                                            w: Number(b.mobile_w ?? 12) || 12,
                                            h: Number(b.mobile_h ?? b.h) || 4
                                        }))
                                    }}
                                    rowHeight={30}
                                    margin={[15, 15]}
                                    isDraggable={false}
                                    isResizable={false}
                                    style={{ minHeight: '10px' }}
                                >
                                    {blocks.map(block => {
                                        const compJSON = finalJSON.components.find(c => c.id === block.i);
                                        if (!compJSON) return null;
                                        return (
                                            <div key={String(block.i)}>
                                                <ChartComponent dataMap={dataMap}
                                                    comp={compJSON} rawData={dataMap[compJSON.dataSourceId] || []} filteredData={getFilteredDataForComp(compJSON)}
                                                    aggregateData={aggregateData} filters={filters} onFilterChange={handlePreviewFilterChange}
                                                    missingDropdowns={getEditorMissingDropdowns(compJSON)} isDropdownDisabled={checkEditorDropdownDisabled(compJSON)}
                                                    aggregateStackedData={aggregateStackedData} isEditing={false} editorBreakpoint={editorBreakpoint} previewDevice={previewDevice}
                                                />
                                            </div>
                                        );
                                    })}
                                </ResponsiveRGL>

                                {/* 📄 完美移植 2：發布版的頁尾 (更新時間 + 來源 + 底部浮水印) */}
                                {(globalMeta.lastUpdated || (globalMeta.dataSources && globalMeta.dataSources.some(s => s.name)) || (globalMeta.watermarkUrl && globalMeta.watermarkPosition === 'bottom-right')) && (
                                    <div className="news-footer" style={{ marginTop: '30px', paddingTop: '15px', borderTop: '1px dashed #ddd', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', fontSize: '0.85rem', color: '#888' }}>
                                        <div className="news-footer-left" style={{ display: 'flex', flexDirection: 'column', gap: '5px', textAlign: 'left' }}>
                                            {globalMeta.lastUpdated && <div>🕒 更新時間：{globalMeta.lastUpdated}</div>}
                                            {globalMeta.dataSources && globalMeta.dataSources.length > 0 && (
                                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px', alignItems: 'center' }}>
                                                    {globalMeta.dataSources.some(s => s.name) && <span>資料來源：</span>}
                                                    {globalMeta.dataSources.filter(s => s.name).map((source, idx, arr) => (
                                                        <span key={idx}>
                                                            {source.url ? <a href={source.url} target="_blank" rel="noreferrer" style={{ color: '#086788', textDecoration: 'none', fontWeight: 'bold' }}>{source.name}</a> : <span>{source.name}</span>}
                                                            {idx < arr.length - 1 && '、'}
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        {globalMeta.watermarkUrl && globalMeta.watermarkPosition === 'bottom-right' && (
                                            <img src={globalMeta.watermarkUrl} alt="Watermark" className="news-watermark" style={{ height: `${globalMeta.watermarkSize || 40}px`, objectFit: 'contain' }} />
                                        )}
                                    </div>
                                )}

                            </div>
                        </div>
                    )}
                    {/* 👇 新增：格式範例的彈出視窗 👇 */}
                    {showFormatModal && currentSelectedBlock && (() => {
                        const exType = currentSelectedBlock.type === 'stackedBarChart' ? 'barChart' : currentSelectedBlock.type;
                        const ex = formatExamples[exType] || formatExamples.barChart;
                        return (
                            <div className="modal-overlay" onClick={() => setShowFormatModal(false)}>
                                {/* 🌟 加入 maxHeight 與 overflowY 避免雙表超出螢幕 */}
                                <div className="modal-content" onClick={e => e.stopPropagation()} style={{ width: '750px', padding: '30px', maxHeight: '90vh', overflowY: 'auto' }}>
                                    <button className="close-modal-btn" onClick={() => setShowFormatModal(false)}>✕</button>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '20px', paddingRight: '20px' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '15px', flexWrap: 'wrap' }}>
                                            <h2 style={{ color: '#086788', margin: 0, fontSize: '1.4rem' }}>
                                                💡 {ex.title} - 格式範例
                                            </h2>
                                            {/* 👇 複製表格魔法按鈕 (升級支援雙表複製) 👇 */}
                                            <button
                                                onClick={(e) => {
                                                    let copyText = '';
                                                    if (ex.tables) {
                                                        // 雙表模式：加上表頭名稱並用換行隔開
                                                        copyText = ex.tables.map(t => `${t.title}\n${t.headers.join('\t')}\n${t.rows.map(row => row.join('\t')).join('\n')}`).join('\n\n\n');
                                                    } else {
                                                        // 單表模式
                                                        const headerText = ex.headers.join('\t');
                                                        const rowsText = ex.rows.map(row => row.join('\t')).join('\n');
                                                        copyText = `${headerText}\n${rowsText}`;
                                                    }
                                                    navigator.clipboard.writeText(copyText);

                                                    const btn = e.currentTarget;
                                                    const originalHtml = btn.innerHTML;
                                                    btn.innerHTML = '✅ 已複製！';
                                                    btn.style.background = '#2ECC71';
                                                    btn.style.color = '#fff';
                                                    btn.style.borderColor = '#2ECC71';

                                                    setTimeout(() => {
                                                        btn.innerHTML = originalHtml;
                                                        btn.style.background = '#fff';
                                                        btn.style.color = '#086788';
                                                        btn.style.borderColor = '#086788';
                                                    }, 2000);
                                                }}
                                                style={{ background: '#fff', color: '#086788', border: '1px solid #086788', padding: '4px 10px', borderRadius: '4px', cursor: 'pointer', fontSize: '0.8rem', fontWeight: 'bold', transition: 'all 0.2s', flexShrink: 0 }}
                                            >
                                                📋 複製內容
                                            </button>
                                        </div>
                                        <p style={{ color: '#555', lineHeight: '1.6', margin: 0, fontSize: '0.95rem', whiteSpace: 'pre-wrap' }}>{ex.desc}</p>
                                    </div>

                                    {/* 🌟 根據單表或雙表結構動態渲染 */}
                                    {ex.tables ? (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                            {ex.tables.map((t, idx) => (
                                                <div key={idx}>
                                                    <div style={{ fontWeight: 'bold', color: '#333', marginBottom: '8px', paddingLeft: '5px', borderLeft: '3px solid #086788' }}>{t.title}</div>
                                                    <div style={{ overflowX: 'auto', borderRadius: '8px', border: '1px solid #ddd', boxShadow: '0 4px 6px rgba(0,0,0,0.05)' }}>
                                                        <table className="custom-table" style={{ width: '100%', minWidth: '500px', margin: 0 }}>
                                                            <thead>
                                                                <tr>{t.headers.map((h, i) => <th key={i} style={{ background: '#f5f5f5', color: '#333', borderBottom: '2px solid #ccc', padding: '12px 15px' }}>{h}</th>)}</tr>
                                                            </thead>
                                                            <tbody>
                                                                {t.rows.map((row, i) => (
                                                                    <tr key={i}>{row.map((cell, j) => <td key={j} style={{ color: '#444', padding: '10px 15px', borderBottom: '1px solid #eee' }}>{cell}</td>)}</tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div style={{ overflowX: 'auto', borderRadius: '8px', border: '1px solid #ddd', boxShadow: '0 4px 6px rgba(0,0,0,0.05)' }}>
                                            <table className="custom-table" style={{ width: '100%', minWidth: '500px', margin: 0 }}>
                                                <thead>
                                                    <tr>
                                                        {ex.headers.map((h, i) => <th key={i} style={{ background: '#f5f5f5', color: '#333', borderBottom: '2px solid #ccc', padding: '12px 15px' }}>{h}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {ex.rows.map((row, i) => (
                                                        <tr key={i}>
                                                            {row.map((cell, j) => <td key={j} style={{ color: '#444', padding: '10px 15px', borderBottom: '1px solid #eee' }}>{cell}</td>)}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    <div style={{ marginTop: '20px', background: '#fff3cd', padding: '15px', borderRadius: '8px', border: '1px solid #ffeeba', fontSize: '0.9rem', color: '#856404', lineHeight: '1.6' }}>
                                        <div style={{ fontWeight: '900', fontSize: '1rem', color: '#d35400', marginBottom: '8px' }}>
                                            🚨 必看！資料防坑黃金定律：
                                        </div>
                                        <ol style={{ margin: '0', paddingLeft: '22px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                            <li><strong>【格式純文字】</strong>請全選 Google Sheet，將格式設為<strong>「純文字 (Plain Text)」</strong>，避免 Google API 自動吃掉資料。</li>
                                            <li><strong>【數值要乾淨】</strong>準備畫圖的「數值欄位」<strong>只能填數字</strong> (可含小數/負號)。若無資料請填 <code>0</code> 或留白，千萬別填「未定」或「-」。</li>
                                            <li><strong>【表頭避純數】</strong>第一列的欄位名稱 (表頭) <strong>請勿只填純數字</strong> (如 <code>2024</code> 會出錯，請改成 <code>2024年</code>)。</li>
                                            <li><strong>【欄位可自訂】</strong>上方表格的表頭名稱僅供參考，您可以自由命名，只要在右側面板綁定正確即可！</li>
                                        </ol>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                    {showPublishModal && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <button className="close-modal-btn" onClick={() => setShowPublishModal(false)}>✕</button>
                                <h2 style={{ color: '#086788', marginTop: 0 }}>🎉 發布成功並存入雲端！</h2>
                                <p style={{ lineHeight: '1.6' }}>
                                    您的圖表設定已成功存入 Firebase！專屬 ID 為：<strong style={{ background: '#eee', padding: '2px 6px', borderRadius: '4px' }}>{publishedId}</strong>
                                </p>
                                <p style={{ fontWeight: 'bold', marginTop: '20px' }}>請複製以下的 iframe 程式碼，並貼上到您的新聞後台中：</p>

                                <div className="code-snippet">
                                    &lt;iframe <br />
                                    &nbsp;&nbsp;src="https://jjbatman-fw.github.io/MakeMyOwnGraph/index.html?id={publishedId}&mode=view" <br />
                                    &nbsp;&nbsp;width="100%" <br />
                                    &nbsp;&nbsp;height="800px" <br />
                                    &nbsp;&nbsp;frameborder="0" <br />
                                    &nbsp;&nbsp;scrolling="no"<br />
                                    &gt;&lt;/iframe&gt;
                                </div>

                                <div style={{ display: 'flex', gap: '15px', marginTop: '30px', justifyContent: 'flex-end' }}>
                                    <button className="action-btn" style={{ background: '#eee', color: '#555', padding: '10px 20px' }} onClick={() => setShowPublishModal(false)}>關閉</button>
                                    <button className="publish-btn" onClick={handleCopy}>📋 一鍵複製代碼</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
</body>

</html>
